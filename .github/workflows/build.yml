name: Build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check publication structure
        run: npm run test:editorial
      - name: Build site
        run: npm run build
        env:
          PREVIEW_BASE: ${{ github.event_name == 'pull_request' && format('/doskvol-dedikodu/taslak/pr-{0}/', github.event.number) || '' }}
      - name: Upload PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: dist
          retention-days: 3
