name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Build check]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

# Serialize updates to the shared publication tree, including the deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production
          path: dist

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') ||
       github.event_name == 'pull_request_target')
    permissions:
      contents: write
      actions: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Never execute PR source in this privileged job.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate preview source
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request_target') {
              core.setOutput('mode', 'remove');
              core.setOutput('pr', context.payload.number);
            } else if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              const number = run.pull_requests[0]?.number;
              if (!number || run.head_repository.full_name !== context.repo.owner + '/' + context.repo.repo) return;
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha || pr.head.repo.full_name !== run.head_repository.full_name) return;
              core.setOutput('mode', 'preview');
              core.setOutput('pr', number);
              core.setOutput('sha', run.head_sha);
            } else {
              core.setOutput('mode', 'production');
            }
      - name: Register PR preview deployment
        if: steps.source.outputs.mode == 'preview'
        id: preview
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          PREVIEW_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.PREVIEW_SHA,
              environment: `preview-pr-${process.env.PR_NUMBER}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            });
            core.setOutput('id', deployment.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false,
            });
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.mode == 'production'
        with:
          name: production
          path: incoming
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.mode == 'preview'
        with:
          name: pr-preview
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Restore publication tree
        if: steps.source.outputs.mode != ''
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add publication FETCH_HEAD
          else
            mkdir publication
            git -C publication init -b gh-pages
          fi
      - name: Merge publication
        if: steps.source.outputs.mode != ''
        env:
          MODE: ${{ steps.source.outputs.mode }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
        run: node scripts/merge-pages.mjs publication incoming "$MODE" "$PR_NUMBER"
      - name: Save publication tree
        if: steps.source.outputs.mode != ''
        run: |
          set -euo pipefail
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          touch .nojekyll
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Update Pages publication'
          fi
          # Use the authenticated parent repository for the initial branch too.
          cd ..
          git fetch ./publication HEAD
          git push origin FETCH_HEAD:refs/heads/gh-pages
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.mode != ''
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.mode != ''
        with:
          path: publication
      - uses: actions/deploy-pages@v4
        if: steps.source.outputs.mode != ''
        id: deployment
      - name: Update PR preview deployment status
        if: always() && steps.preview.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.preview.outputs.id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          PUBLISH_RESULT: ${{ steps.deployment.outcome }}
        with:
          script: |
            const state = process.env.PUBLISH_RESULT === 'success' ? 'success' : 'failure';
            const url = state === 'success'
              ? process.env.PAGE_URL.replace(/\/$/, '') + `/taslak/pr-${process.env.PR_NUMBER}/`
              : undefined;
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: false,
            });
      - name: Retire replaced or removed PR previews
        if: >-
          steps.deployment.outcome == 'success' &&
          (steps.source.outputs.mode == 'preview' || steps.source.outputs.mode == 'remove')
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          DEPLOYMENT_ID: ${{ steps.preview.outputs.id }}
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo,
              environment: `preview-pr-${process.env.PR_NUMBER}`,
            });
            for (const deployment of deployments) {
              if (deployment.id === Number(process.env.DEPLOYMENT_ID)) continue;
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                auto_inactive: false,
              });
            }
