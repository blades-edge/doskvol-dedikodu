media:
  input: src/assets/images
  output: ../../assets/images
  extensions: [png, jpg, jpeg, webp, avif]

settings:
  content:
    merge: true

content:
  - name: issues
    label: Sayılar
    type: collection
    path: src/content/issues
    format: json
    subfolders: false
    filename:
      template: "{number}.json"
      field: create
    operations:
      rename: false
    view:
      primary: number
      fields: [number, date, draft]
      sort: [number, date]
      default: { sort: number, order: desc }
    fields:
      - name: number
        label: Sayı numarası
        type: number
        required: true
        options: { min: 1 }
        description: "1, 2, 3… Her sayı için farklı bir tam sayı kullanın."
      - name: draft
        label: Taslak sayı
        type: boolean
        default: true
        description: "Açıksa sayı ve ona bağlı yazılar sitede görünmez. Manşeti seçtikten ve yazıları tamamladıktan sonra kapatın."
      - name: date
        label: Yayın tarihi
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: description
        label: Kapak spotu
        type: text
        required: true
      - name: price
        label: Baskı bedeli
        type: string
        required: true
        default: "2 mangır"
      - name: lead
        label: Manşet yazısı
        type: reference
        description: "Önce sayıyı taslak olarak kaydedin, sonra ona bağlı yazıyı ekleyip buradan seçin. Kapak başlığı bu yazıdan alınır."
        options:
          collection: articles
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: chapters
        label: Bu sayıdaki tefrika bölümleri
        type: reference
        description: "Önce Tefrika bölümleri menüsünde bölümü hazırlayın, sonra burada seçin. Seçilmeyen bölümler yayımlanmaz."
        options:
          collection: chapters
          multiple: true
          value: "{name}"
          label: "Bölüm {fields.episode} · {fields.title}"
          search: "name,fields.title,fields.episode"
      - name: cover
        label: Kapak gravürü
        type: image
        required: true
      - name: coverAlt
        label: Görselin kısa betimi
        type: text
        required: true
        description: "Görseli göremeyen okurlar için neyi gösterdiğini anlatın."
      - name: coverCaption
        label: Görsel altyazısı
        type: string
        required: true

  - name: articles
    label: Yazılar
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, issue, section, order, author]
      sort: [title, order]
      search: [title, description, section]
      default: { sort: title, order: asc }
    fields:
      - { name: title, label: Başlık, type: string, required: true }
      - { name: description, label: Spot / kısa özet, type: text, required: true }
      - name: issue
        label: Ait olduğu sayı
        type: reference
        required: true
        options:
          collection: issues
          value: "{name}"
          label: "Sayı {fields.number}"
          search: "name,fields.number"
      - name: author
        label: Yazar
        type: reference
        required: true
        options:
          collection: authors
          value: "{name}"
          label: "{fields.name}"
          search: "name,fields.name"
      - name: section
        label: Bölüm
        type: select
        required: true
        options:
          values: [Haberler, Dedikodular]
        description: "Tefrika metinlerini ayrı Tefrika bölümleri menüsünden ekleyin."
      - name: district
        label: Mahalle (isteğe bağlı)
        type: select
        options:
          values: [İpekyalı, Rıhtım, Kömürsırtı, Altıkule]
        description: "Gazetede kullanılan mahallelerden seçin. Listede olmayan mahalle veya ayrıntılı mekân adını aşağıya yazabilirsiniz."
      - { name: location, label: Ek yer / serbest mekân adı, type: string }
      - name: order
        label: Sıralama önceliği (isteğe bağlı)
        type: number
        options: { min: 0 }
        description: "Küçük değer önce gelir. Boş bırakırsanız 1000 kabul edilir. Öne almak için 10, 20 gibi değerler verebilirsiniz. Aynı değerler kullanılabilir; eşitlikte dosya adına göre sıralanır. Manşet ayrıca sayı kaydından seçilir."
      - { name: spoiler, label: Spoiler uyarısı, type: text }
      - name: body
        label: Yazı metni
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: chapters
    label: Tefrika bölümleri
    type: collection
    path: src/content/chapters
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, series, episode, author]
      sort: [title, episode]
    fields:
      - { name: title, label: Bölüm başlığı, type: string, required: true }
      - { name: description, label: Spot / kısa özet, type: text, required: true }
      - name: series
        label: Tefrika
        type: reference
        required: true
        options:
          collection: serials
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: episode
        label: Bölüm numarası
        type: number
        required: true
        options: { min: 1 }
      - name: author
        label: Yazar
        type: reference
        required: true
        options:
          collection: authors
          value: "{name}"
          label: "{fields.name}"
          search: "name,fields.name"
      - { name: spoiler, label: Spoiler uyarısı, type: text }
      - name: body
        label: Bölüm metni
        type: rich-text
        required: true
        options: { format: markdown, switcher: true }

  - name: authors
    label: Yazarlar
    type: collection
    path: src/content/authors
    format: json
    subfolders: false
    filename:
      template: "{primary}.json"
      field: create
    operations:
      rename: false
    view:
      primary: name
      fields: [name, bio]
      sort: [name]
      default: { sort: name, order: asc }
    fields:
      - { name: name, label: Yazar adı / imza, type: string, required: true }
      - { name: bio, label: Kısa tanıtım, type: text }

  - name: serials
    label: Tefrikalar
    type: collection
    path: src/content/serials
    format: json
    subfolders: false
    filename:
      template: "{primary}.json"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, description]
      sort: [title]
      default: { sort: title, order: asc }
    fields:
      - { name: title, label: Tefrika adı, type: string, required: true }
      - { name: description, label: Serinin kısa tanıtımı, type: text, required: true }
