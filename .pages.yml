media:
  input: src/assets/images
  output: ../../assets/images
  extensions: [png, jpg, jpeg, webp, avif]

settings:
  content:
    merge: true

components:
  author-picker:
    label: Yazarlar
    type: select
    required: true
    options:
      multiple: true
      min: 1
      values:
        - { name: aldo-brogan, label: "Aldo Brogan" }
        - { name: altinci-sandalye, label: "Altıncı Sandalye" }
        - { name: dr-a-sorel, label: "Dr. A. Sorel" }
        - { name: gaspar-merrow, label: "Gaspar Merrow" }
        - { name: isimsiz-tanik, label: "İsimsiz Bir Tanık" }
        - { name: kor-nokta, label: "Kör Nokta" }
        - { name: mina-karakarga, label: "Mina Karakarga" }
        - { name: ruhi-cengel, label: "Ruhi Çengel" }
        - { name: vaurin-prichard, label: "Vaurin Prichard" }

content:
  - name: gravur
    label: Gravür ayarları
    type: file
    path: src/settings/media.json
    format: json
    fields:
      - name: darkModeImages
        label: Gece görünümü uygulanacak gravürler
        type: image
        options:
          multiple: true
        description: "Medya kütüphanesinden seçin. Seçilen görseller kapakta ve metin içinde gece temasına özel filtre ve zemin rengini alır. Listeden çıkarmak efekti kaldırır."

  - name: sayi
    label: Sayı
    type: collection
    path: src/content/sayi
    format: json
    subfolders: false
    filename:
      template: "{number}.json"
      field: create
    operations:
      rename: false
    view:
      primary: number
      fields: [number, imperialDate.day, imperialDate.month, imperialDate.year]
      sort: [number, date]
      default: { sort: number, order: desc }
    fields:
      - name: number
        label: Sayı numarası
        type: number
        required: true
        options: { min: 1 }
        description: "1, 2, 3… Her sayı için farklı bir tam sayı kullanın."
      - name: date
        label: Gerçek yayın tarihi (RSS)
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: imperialDate
        label: İmparatorluk tarihi
        type: object
        required: true
        fields:
          - name: day
            label: Gün
            type: number
            required: true
            options: { min: 1, max: 60 }
          - name: month
            label: Ay
            type: select
            required: true
            options:
              values: [Mendar, Kalivet, Suran, Ulsivet, Volnivet, Elisar]
          - name: year
            label: Yıl
            type: number
            required: true
            options: { min: 800, max: 1200 }
      - name: price
        label: Baskı bedeli
        type: string
        required: true
        default: "2 mangır"
      - name: lead
        label: Manşet makalesi
        type: reference
        description: "İsteğe bağlı. Boşsa aşağıdaki listedeki ilk makale manşet olur. Seçerseniz listede bulunan bir makaleyi seçin."
        options:
          collection: makale
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: leadRows
        label: Manşetin kapladığı satır sayısı
        type: number
        options: { min: 2 }
        description: "Geniş yerleşimde geçerlidir. Boşsa manşet 2 satır kaplar."
      - name: description
        label: Kapak spotu (isteğe bağlı)
        type: text
        description: "Boşsa manşet makalesinin spotu kullanılır."
      - name: cover
        label: Kapak gravürü (isteğe bağlı)
        type: image
        description: "Boşsa manşet makalesinin gravürü kullanılır."
      - name: coverAlt
        label: Görselin kısa betimi
        type: text
        description: "Boşsa manşet makalesindeki betim kullanılır."
      - name: coverCaption
        label: Görsel altyazısı
        type: string
        description: "Boşsa manşet makalesindeki altyazı kullanılır."

      - name: articles
        label: Bu sayıdaki makaleler
        type: reference
        description: "Seçim listesinin sırası gazeteye yansır; aynı bölümdeki makaleler bu sırayla görünür. İlk makale varsayılan manşettir; ayrıca manşet seçtiyseniz onu da listeye ekleyin. Seçilmeyen makaleler yayımlanmaz."
        options:
          collection: makale
          multiple: true
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: chapters
        label: Bu sayıdaki tefrika bölümleri
        type: reference
        description: "Önce Tefrika bölümleri menüsünde bölümü hazırlayın, sonra burada seçin. Seçim listesinin sırası gazeteye yansır. Seçilmeyen bölümler yayımlanmaz."
        options:
          collection: bolum
          multiple: true
          value: "{name}"
          label: "Bölüm {fields.episode} · {fields.title}"
          search: "name,fields.title,fields.episode"

  - name: sayfa
    label: Sabit sayfalar
    type: collection
    path: src/content/sayfa
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, address]
      sort: [title]
    fields:
      - { name: title, label: Başlık, type: string, required: true }
      - name: address
        label: Kalıcı adres
        type: string
        required: true
        description: "Örnek: kunye → /kunye/. Yalnızca küçük Latin harfleri, rakamlar ve aradaki tireleri kullanın. Site yollarıyla veya başka bir sayfayla çakışan adresler derlemeyi durdurur. Ana yayına alınan her sayfa bu adreste yayımlanır."
      - { name: description, label: Kısa açıklama, type: text }
      - name: body
        label: Sayfa metni
        type: rich-text
        required: true
        options: { format: markdown, switcher: true }

  - name: makale
    label: Makale
    type: collection
    path: src/content/makale
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, section, author]
      sort: [title]
      search: [title, description, section]
      default: { sort: title, order: asc }
    fields:
      - { name: title, label: Başlık, type: string, required: true }
      - { name: description, label: Spot / kısa özet, type: text, required: true }
      - name: author
        component: author-picker
      - name: section
        label: Bölüm
        type: select
        required: true
        options:
          values: [Haberler, Dedikodular]
        description: "Tefrika metinlerini ayrı Tefrika bölümleri menüsünden ekleyin."
      - name: district
        label: Mahalle (isteğe bağlı)
        type: select
        options:
          values:
            - Aktaç
            - Altıkule
            - Billurtaş
            - Bozçamur
            - İpekyalı
            - Kargaayağı
            - Kömürsırtı
            - Gecepazarı
            - Nizamhane
            - Rıhtım
            - Yanıkçukur
            - Yarıktepe
            - Yitik Mahalle
            - Ölümdiyarı
        description: "Gazetede kullanılan mahallelerden seçin. Listede olmayan mahalle veya ayrıntılı mekân adını aşağıya yazabilirsiniz."
      - { name: location, label: Ek yer / serbest mekân adı, type: string }
      - { name: spoiler, label: Spoiler uyarısı, type: text }
      - name: cover
        label: Makale gravürü (isteğe bağlı)
        type: image
        description: "Makale manşet olduğunda kapak gravürü için de kullanılır."
      - name: coverAlt
        label: Gravürün kısa betimi
        type: text
        description: "Görseli göremeyen okurlar için neyi gösterdiğini anlatın."
      - name: coverCaption
        label: Gravür altyazısı
        type: string
      - name: body
        label: Makale metni
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          
  - name: tefrika
    label: Tefrika
    type: collection
    path: src/content/tefrika
    format: json
    subfolders: false
    filename:
      template: "{primary}.json"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, description]
      sort: [title]
      default: { sort: title, order: asc }
    fields:
      - { name: title, label: Tefrika adı, type: string, required: true }
      - { name: description, label: Serinin kısa tanıtımı, type: text, required: true }
      
  - name: bolum
    label: Tefrika bölümü
    type: collection
    path: src/content/bolum
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, series, episode, author]
      sort: [title, episode]
    fields:
      - { name: title, label: Bölüm başlığı, type: string, required: true }
      - { name: description, label: Spot / kısa özet, type: text, required: true }
      - name: series
        label: Tefrika
        type: reference
        required: true
        options:
          collection: tefrika
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: episode
        label: Bölüm numarası
        type: number
        required: true
        options: { min: 1 }
      - name: author
        component: author-picker
      - { name: spoiler, label: Spoiler uyarısı, type: text }
      - name: shareImage
        label: Paylaşım kapağı (isteğe bağlı)
        type: image
        description: "Yalnızca bağlantı önizlemelerinde kullanılır. Boşsa sayının kapak görseli kullanılır."
      - name: shareImageAlt
        label: Paylaşım kapağının kısa betimi
        type: text
      - name: body
        label: Bölüm metni
        type: rich-text
        required: true
        options: { format: markdown, switcher: true }

  - name: yazar
    label: Yazarlar
    type: file
    path: src/content/yazarlar.yml
    format: yaml
    list: true
    fields:
      - name: id
        label: Kalıcı yazar kimliği
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: "Her yazara benzersiz bir kimlik verin. İmza değişse bile kimliği koruyun."
      - { name: name, label: Yazar adı / imza, type: string, required: true }
      - { name: bio, label: Kısa tanıtım, type: text }
      - name: title
        label: Unvan
        type: string
        description: "İsteğe bağlı. Örnek: Kargaayağı muhabiri."
