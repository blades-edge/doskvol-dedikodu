media:
  input: src/assets/images
  output: ../../assets/images
  extensions: [png, jpg, jpeg, webp, avif]

settings:
  content:
    merge: true

content:
  - name: sayi
    label: Sayı
    type: collection
    path: src/content/sayi
    format: json
    subfolders: false
    filename:
      template: "{number}.json"
      field: create
    operations:
      rename: false
    view:
      primary: number
      fields: [number, date, draft]
      sort: [number, date]
      default: { sort: number, order: desc }
    fields:
      - name: number
        label: Sayı numarası
        type: number
        required: true
        options: { min: 1 }
        description: "1, 2, 3… Her sayı için farklı bir tam sayı kullanın."
      - name: draft
        label: Taslak sayı
        type: boolean
        default: true
        description: "Açıksa sayı ve ona bağlı makaleler sitede görünmez. Manşeti seçtikten ve makaleleri tamamladıktan sonra kapatın."
      - name: preview
        label: Önizleme bağlantısını aç
        type: boolean
        default: false
        description: "Açıksa kayıttan ve site derlemesinden sonra /onizleme/sayi/NUMARA/ adresi açılır (2 için 002). Bağlantısı olan herkes erişebilir; arşivde ve RSS’te listelenmez; arama motorlarına indekslenmemesi bildirilir. Gizli içerik için kullanmayın."
      - name: date
        label: Yayın tarihi
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: description
        label: Kapak spotu
        type: text
        required: true
      - name: price
        label: Baskı bedeli
        type: string
        required: true
        default: "2 mangır"
      - name: lead
        label: Manşet makalesi
        type: reference
        description: "Aşağıdaki makale listesinde bulunan bir makaleyi seçin. Manşet her zaman kapakta önce gösterilir."
        options:
          collection: makale
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: makale
        label: Bu sayıdaki makaleler
        type: reference
        description: "Seçim listesinin sırası gazeteye yansır; aynı bölümdeki makaleler bu sırayla görünür. Manşeti de listeye ekleyin. Seçilmeyen makaleler yayımlanmaz."
        options:
          collection: makale
          multiple: true
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: bolum
        label: Bu sayıdaki tefrika bölümleri
        type: reference
        description: "Önce Tefrika bölümleri menüsünde bölümü hazırlayın, sonra burada seçin. Seçim listesinin sırası gazeteye yansır. Seçilmeyen bölümler yayımlanmaz."
        options:
          collection: bolum
          multiple: true
          value: "{name}"
          label: "Bölüm {fields.episode} · {fields.title}"
          search: "name,fields.title,fields.episode"
      - name: cover
        label: Kapak gravürü
        type: image
        required: true
      - name: coverAlt
        label: Görselin kısa betimi
        type: text
        required: true
        description: "Görseli göremeyen okurlar için neyi gösterdiğini anlatın."
      - name: coverCaption
        label: Görsel altyazısı
        type: string
        required: true

  - name: makale
    label: Makale
    type: collection
    path: src/content/makale
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, section, author]
      sort: [title]
      search: [title, description, section]
      default: { sort: title, order: asc }
    fields:
      - { name: title, label: Başlık, type: string, required: true }
      - { name: description, label: Spot / kısa özet, type: text, required: true }
      - name: author
        label: Yazar
        type: reference
        required: true
        options:
          collection: yazar
          value: "{name}"
          label: "{fields.name}"
          search: "name,fields.name"
      - name: section
        label: Bölüm
        type: select
        required: true
        options:
          values: [Haberler, Dedikodular]
        description: "Tefrika metinlerini ayrı Tefrika bölümleri menüsünden ekleyin."
      - name: district
        label: Mahalle (isteğe bağlı)
        type: select
        options:
          values: [İpekyalı, Rıhtım, Kömürsırtı, Altıkule]
        description: "Gazetede kullanılan mahallelerden seçin. Listede olmayan mahalle veya ayrıntılı mekân adını aşağıya yazabilirsiniz."
      - { name: location, label: Ek yer / serbest mekân adı, type: string }
      - { name: spoiler, label: Spoiler uyarısı, type: text }
      - name: body
        label: Makale metni
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: bolum
    label: Tefrika bölümü
    type: collection
    path: src/content/bolum
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, series, episode, author]
      sort: [title, episode]
    fields:
      - { name: title, label: Bölüm başlığı, type: string, required: true }
      - { name: description, label: Spot / kısa özet, type: text, required: true }
      - name: series
        label: Tefrika
        type: reference
        required: true
        options:
          collection: tefrika
          value: "{name}"
          label: "{fields.title}"
          search: "name,fields.title"
      - name: episode
        label: Bölüm numarası
        type: number
        required: true
        options: { min: 1 }
      - name: author
        label: Yazar
        type: reference
        required: true
        options:
          collection: yazar
          value: "{name}"
          label: "{fields.name}"
          search: "name,fields.name"
      - { name: spoiler, label: Spoiler uyarısı, type: text }
      - name: body
        label: Bölüm metni
        type: rich-text
        required: true
        options: { format: markdown, switcher: true }

  - name: yazar
    label: Yazar
    type: collection
    path: src/content/yazar
    format: json
    subfolders: false
    filename:
      template: "{primary}.json"
      field: create
    operations:
      rename: false
    view:
      primary: name
      fields: [name, bio]
      sort: [name]
      default: { sort: name, order: asc }
    fields:
      - { name: name, label: Yazar adı / imza, type: string, required: true }
      - { name: bio, label: Kısa tanıtım, type: text }

  - name: tefrika
    label: Tefrika
    type: collection
    path: src/content/tefrika
    format: json
    subfolders: false
    filename:
      template: "{primary}.json"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, description]
      sort: [title]
      default: { sort: title, order: asc }
    fields:
      - { name: title, label: Tefrika adı, type: string, required: true }
      - { name: description, label: Serinin kısa tanıtımı, type: text, required: true }
