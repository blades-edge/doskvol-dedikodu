        - generic [ref=f1e13]: İpekyalı · Özel haber
        - heading "Kızıl Kuşaklar Okulu’nda gece yarısı ziyareti" [level=1] [ref=f1e14]
        - paragraph [ref=f1e15]: Üç isimsiz konuk, ters çalışan bir saat ve sabaha karşı susturulan bir zil. İpekyalı’daki okulun kapısında yaşananları araştırdık.
        - generic [ref=f1e16]:
          - generic [ref=f1e17]: Mina Karakarga · Özel muhabir
          - time [ref=f1e18]: 29 Ekim 2026
          - generic [ref=f1e19]: Sayı 001 · Gece baskısı
      - article "Kızıl Kuşaklar Okulu’nda gece yarısı ziyareti" [ref=f1e20]:
        - paragraph [ref=f1e21]: "İpekyalı’da bir kapının gece yarısı açılması haber sayılmaz. Aynı kapının üç kez açılması, her seferinde başka bir yüzün görünmesi ve içerideki saatin her konuktan sonra bir saat geri gitmesi ise matbaamızın mürekkebine değer. Kızıl Kuşaklar Okulu’nun karşısındaki apartmanda oturan üç kişi, dün gece gördüklerini birbirinden habersiz anlattı. Saat konusunda anlaşamadılar. Kapı konusunda hepsi aynı şeyi söyledi: İçeri girenler vardı, çıkan yoktu."
        - paragraph [ref=f1e22]: İlk ziyaretçinin yüzünü uzun bir tül örttüğü, ikincisinin boş bir kafes taşıdığı ileri sürülüyor. Üçüncü ziyaretçi içinse tanıklarımızın kullandığı tek ortak sözcük “ıslak”. Oysa mahallede gün boyunca yağmur yağmadı. Okulun taş merdivenlerinde bu sabah gördüğümüz su izleri, sokağa doğru değil, duvara doğru ilerliyordu.
        - figure "Okulun kuzey duvarındaki servis geçidi. Gravür görseli için ayrılmış alan; bir olay fotoğrafı değildir." [ref=f1e23]:
          - img "Okulun servis geçidi için ayrılmış temsili gravür alanı" [ref=f1e24]: DOSKVOL
        - heading "Zil neden dört kez çaldı?" [level=2] [ref=f1e26]
        - paragraph [ref=f1e27]: Okulun emekli aşçısı Nera Dalkır, bina boşaltıldığında mutfak zilinin de söküldüğünü söylüyor. “Dilin ucundaki çatlağı ben bilirim,” dedi. “Çorba pişerken bile insanın dişini kamaştırırdı. Dün gece duyduğum oydu.” Dalkır’ın ifadesine göre zil dört kez çaldı. Kendisine üç konuktan söz ettiğimizde bir süre sustu, sonra penceresini kapattı.
        - paragraph [ref=f1e28]: Binanın bugünkü kâtibi ise görüşme talebimizi kabul etmedi. Kapı aralığından uzattığı kâğıtta yalnızca “Kayıtlarımız eksiksizdir” yazıyordu. Kâğıdın arkasında, silinmeye çalışılmış bir isim seçiliyordu. Aynı ismi okulun eski mezun listesinden kontrol etmek istediğimizde, ilgili sayfanın defterden çıkarıldığını gördük.
        - blockquote [ref=f1e29]:
          - paragraph [ref=f1e30]: “Kimsenin çıkmadığını söylemedim. Çıkan kimseyi görmediğimi söyledim. Arada geçimimi sağlayacak kadar fark var.”
        - paragraph [ref=f1e31]: Bu sözler, okulun karşısında gece nöbeti tutan arabacıya ait. Arabacı adını vermek istemedi; atının adını da yayımlamamamızı özellikle rica etti.
        - heading "Kayıtlara geçmeyen bir teslimat" [level=2] [ref=f1e32]
        - paragraph [ref=f1e33]: Yakındaki bir ciltçinin çırağı, okuldan sabaha karşı bir defter çıkarıldığını anlattı. Defterin boyunu iki eliyle gösterdi, rengini hatırlamadığını söyledi. Ardından, daha önce sormadığımız hâlde, onu kendisinin taşımadığını ekledi. Çırağın ustası görüşmemizi burada sona erdirdi.
        - paragraph [ref=f1e34]: Mahallede anlatılanlar kadar anlatılmayanlar da dikkat çekiyor. Dün akşam açık olan iki dükkân bugün kepenk indirmişti. Sokağın köşesindeki fener, yakıtı bulunduğu hâlde söndürülmüştü. Okulun zilini soran bir başka muhabirin ise bize ait olmadığı anlaşıldı. Şimdilik hangi gazeteden geldiğini bilmiyoruz.
        - paragraph [ref=f1e35]: "Bu haber baskıya girerken okuldan ikinci bir açıklama geldi. İlk kâğıtla aynı el yazısıydı: “Kayıtlarımızda hiçbir eksik yoktur.” Bu kez arkasını çevirmememiz istendi."
        - paragraph [ref=f1e36]:
          - emphasis [ref=f1e37]: "Editörün notu: Tanık anlatımları birbiriyle tam olarak örtüşmüyor. Üç ziyaretçinin kimliği ve defterin nereye götürüldüğü henüz doğrulanmış değil. Okurlarımızın okul kapısına isimlerini bırakmamalarını rica ediyoruz."
