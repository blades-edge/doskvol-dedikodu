      - complementary "Spoiler uyarısı" [ref=f2e22]:
        - strong [ref=f2e23]: Oyun günlüğü · Spoiler uyarısı
        - paragraph [ref=f2e24]: Bu bölüm, Kızıl Kuşaklar Okulu’ndaki gece ziyaretiyle ilgili kurgu sırlarını açığa çıkarır. Haberle aynı olayı başka bir gözden anlatır. Gerçek bir oyun grubunun günlüğüne dayanmaz.
      - article "Adımı bilen kapı" [ref=f2e25]:
        - paragraph [ref=f2e26]: Şimdi buraya doğru dürüst bir saat yazabilmeyi isterdim. Gece yarısı demek kolay. Fakat ben okulun kapısına vardığımda karşıdaki kule on biri, cebimdeki saat ikiyi, kapının arkasındaki kadınsa henüz doğmadığımı söylüyordu. Üçünden hangisine güveneceğimi bilemedim. Cebimdeki saati bir hafta önce çalmıştım; en azından onun bana borcu vardı.
        - paragraph [ref=f2e27]: Kadın kapıyı açmadı. Önce adımı sordu.
        - paragraph [ref=f2e28]: “Kör Nokta,” dedim.
        - paragraph [ref=f2e29]: “Öteki.”
        - paragraph [ref=f2e30]: İşin ücretini burada yeniden konuşmam gerekirdi. Sonradan insanın aklına hep doğru cümleler geliyor. Ben o sırada yalnızca eldivenimin başparmağındaki deliğe baktım. Beni buraya gönderen adamın verdiği paralar, aynı delikten sızıp avucumda birikmiş gibiydi.
        - paragraph [ref=f2e31]: “Öteki adımı unuttum,” dedim.
        - paragraph [ref=f2e32]: Kapı açıldı.
        - heading "Koridorun sonundaki masa" [level=2] [ref=f2e33]
        - paragraph [ref=f2e34]: İçerisi bir okul gibi kokmuyordu. Tebeşir, ter, kaynatılmış lahana beklemiştim. Islak kâğıt kokusu vardı. Duvarlara asılı mezun resimlerinin yüzleri, sanki yakın zamanda silinmiş de kurumaya bırakılmıştı. Çerçevelerin altındaki pirinç levhalarda isimler duruyordu. Hiçbirini yüksek sesle okumadım.
        - paragraph [ref=f2e35]: Kadın beni koridorun sonundaki masaya götürdü. Masada bir defter, bir mürekkep hokkası ve ters çevrilmiş bir fincan vardı.
        - paragraph [ref=f2e36]: “Yalnızca defteri,” dedi.
        - paragraph [ref=f2e37]: “Fincanı istememiştim zaten.”
        - paragraph [ref=f2e38]: “Güzel.”
        - paragraph [ref=f2e39]: Bunu çok çabuk söyledi. Fincana bir daha bakmamaya karar verdim. İyi kararları genellikle geç veririm; bunu vaktinde vermiş olmaktan gurur duyuyordum ki masanın altından bir çocuk güldü.
        - paragraph [ref=f2e40]: Eğilmedim.
        - heading "Dördüncü zil" [level=2] [ref=f2e41]
        - paragraph [ref=f2e42]: Defter, beklediğimden hafifti. Kapağı çatlak deridendi; sırtındaki dikişlerin bir kısmı kırmızı iplikle yenilenmişti. Ciltçinin işi iyi değildi. Yahut çok iyi bir ciltçi, kötü bir ciltçi gibi görünmek için uğraşmıştı. Bu şehirde iki ihtimalin ücreti de aynıdır.
        - paragraph [ref=f2e43]: Kadın avucunu masaya koydu. Parmaklarının arasında, kâğıtta yan yana açılmış beş yarık varmış gibi ince gölgeler uzanıyordu.
        - paragraph [ref=f2e44]: “Yoldayken açılabilir,” dedi. “Açılırsa sayfaları tutma.”
        - paragraph [ref=f2e45]: “Nasıl taşıyayım?”
        - paragraph [ref=f2e46]: “Düşürmeden.”
        - paragraph [ref=f2e47]: İlk zil o sırada çaldı. Sonra ikincisi. Üçüncüde koridordan bir kafesin demir zemine sürtündüğünü duydum. Kadın yüzünü kapıya çevirdi. Fincan, masanın üzerinde kendi kendine biraz ilerledi.
        - blockquote [ref=f2e48]:
          - paragraph [ref=f2e49]: “Dördüncüyü duyarsan, burada bulunmuş olduğuna dair hiçbir şeyi yanında götürme.”
        - paragraph [ref=f2e50]: Bunu bana söylemedi. Masanın altına söyledi.
        - paragraph [ref=f2e51]: Dördüncü zil çaldığında defteri ceketimin içine soktum. İyi kararlar hakkında az önce yazdıklarımı geri alıyorum.
        - separator [ref=f2e52]
        - paragraph [ref=f2e53]: Arka kapıya koşarken cebimdeki saat durdu. Geçitteki su, botlarımı sokağa doğru değil, duvara doğru çekiyordu. Bir an, okulun dışarıdan göründüğü kadar büyük olmadığını düşündüm. Daha doğrusu, dışarının sandığım yerde olmadığını.
        - paragraph [ref=f2e54]: Duvarda bir kapı aradım. Yoktu. Yalnızca badananın altında, çocuk elinden çıkmış gibi duran ince bir çizgi vardı. Çizginin yanında da bir isim.
        - paragraph [ref=f2e55]: Benim unuttuğum isim.
        - paragraph [ref=f2e56]: Arkamdan bir şey gelmedi. Bunu özellikle yazıyorum, çünkü gazeteci kadın yarın sorarsa doğru cevap vermek istiyorum. Arkamdan bir şey gelmedi. Yalnızca önümdeki duvarın arkasından biri, kendi sesimle, “Geç kaldın,” dedi.
        - paragraph [ref=f2e57]: Defter o sırada açıldı.
        - paragraph [ref=f2e58]: "İlk sayfada bugünün tarihi vardı. Altında benim el yazımla bir cümle:"
        - paragraph [ref=f2e59]:
          - emphasis [ref=f2e60]: Kapıyı açma. Ben de açtım.
